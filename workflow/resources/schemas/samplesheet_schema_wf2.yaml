$schema: "https://json-schema.org/draft/2020-12/schema"
description: Samplesheet validation of Clonucopya
csv:
  delimiter: ','
columns:
  - name: study
    type: string
    rules:
      not_empty: true
    description: name of the group of samples
  - name: sex
    type: string
    rules:
      not_empty: true
      in_array: [male, female, unknown]
    description: sex of the patient who belongs the sample
  - name: pyclone_vi
    type: string
    rules:
      not_empty: true
      is_file: true
    description: path to Pyclone-vi input file
  - name: metadata
    type: string
    rules:
      not_empty: true
    description: path to the alias metadata file