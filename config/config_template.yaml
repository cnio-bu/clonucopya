# Remove '_template' from config_template.yaml or change the path in Snakefile

samplesheet: "/path/to/samplesheet/config/samplesheet.csv"

# Indexed bam files of study's samples. Leave it empty "" if you dont have bam files

bam_files: "/path/to/bam/files/directory"

# True / False

bam_check: False

# True / False
just_snv: "True"


params:
    pyclone-vi:
        num_clusters: 40
        density: "beta-binomial"
        num_grid_points: 100
        num_restarts: 10
        seed: 570655569
    phyclone:
        num_chains: 4
        density: "beta-binomial"
        proposal: "fully-adapted"
        burnin: 100
        num_iters: 5000
        seed: 570655569
        grid_size: 101


resources:
    default:
        threads: 1
        mem: 4000
        walltime: 480
    pyclone-vi:
        threads: 2
        mem: 4000
        walltime: 480
    pandrugs:
        threads: 2
        mem: 4000
        walltime: 480
    phyclone:
        threads: 1
        mem: 4000
        walltime: 480
